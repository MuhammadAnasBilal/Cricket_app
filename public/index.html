<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cricket Auction Pro — Live Fantasy Player Auction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a110e;
      --surface: #111e18;
      --surface-card: #15271f;
      --surface-elevated: #1a3227;
      --border: #233e31;
      --border-focus: #10b981;
      --text: #f0fdf4;
      --text-muted: #86a394;
      --text-dim: #5c786a;
      --accent: #10b981;
      --accent-hover: #059669;
      --gold: #f59e0b;
      --gold-light: #fef3c7;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --radius: 12px;
      --radius-sm: 8px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Bar */
    .navbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #fff;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #10b981, #047857);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.25);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .status-badge.live {
      color: #34d399;
      border-color: rgba(52, 211, 153, 0.4);
      background: rgba(52, 211, 153, 0.1);
    }
    .status-badge.live .status-dot {
      background: #34d399;
      box-shadow: 0 0 8px #34d399;
      animation: pulse 1.5s infinite;
    }

    .status-badge.lobby {
      color: #fbbf24;
      border-color: rgba(251, 191, 36, 0.4);
      background: rgba(251, 191, 36, 0.1);
    }
    .status-badge.lobby .status-dot {
      background: #fbbf24;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .sound-btn {
      background: var(--surface-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .sound-btn:hover {
      background: var(--surface-elevated);
      border-color: var(--border-focus);
    }

    /* Main Container */
    #app {
      max-width: 1040px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 16px 48px;
      flex: 1;
    }

    /* Cards */
    .card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Typography & Utilities */
    h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.3px; }
    h3 { font-size: 15px; font-weight: 600; }
    .text-muted { color: var(--text-muted); font-size: 14px; }
    .text-dim { color: var(--text-dim); font-size: 12px; }
    .text-gold { color: var(--gold); }
    .tabular { font-variant-numeric: tabular-nums; }

    /* Form Controls */
    .form-group {
      margin-bottom: 14px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    input[type="text"], input[type="password"], input[type="number"] {
      width: 100%;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--accent);
      color: #052e16;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      color: #fff;
    }
    .btn-secondary {
      background: var(--surface-elevated);
      border-color: var(--border);
      color: var(--text);
    }
    .btn-secondary:hover:not(:disabled) {
      border-color: var(--text-muted);
      background: #223f32;
    }
    .btn-gold {
      background: var(--gold);
      color: #451a03;
    }
    .btn-gold:hover:not(:disabled) {
      background: #d97706;
      color: #fff;
    }
    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }
    .btn-danger:hover:not(:disabled) {
      background: var(--danger);
      color: #fff;
    }
    .btn-lg {
      padding: 13px 24px;
      font-size: 16px;
      border-radius: var(--radius);
    }
    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Layout Grids */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .grid-auction {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 20px;
    }
    @media (max-width: 820px) {
      .grid-2, .grid-auction {
        grid-template-columns: 1fr;
      }
    }

    /* Player Block Card */
    .player-card {
      background: linear-gradient(145deg, #162b22, #10211a);
      border: 1px solid #234838;
      border-radius: var(--radius-lg);
      padding: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .player-lot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .lot-badge {
      font-size: 12px;
      font-weight: 700;
      color: var(--gold);
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 3px 10px;
      border-radius: 999px;
    }
    .player-name {
      font-size: 30px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
      line-height: 1.2;
      margin-bottom: 8px;
    }
    .player-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .player-tag {
      font-size: 13px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    /* Bid Counter Showcase */
    .bid-showcase {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .bid-amt-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }
    .bid-amt-val {
      font-size: 36px;
      font-weight: 800;
      color: #fff;
      line-height: 1.1;
    }
    .bid-leader-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--gold);
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 4px 12px;
      border-radius: 999px;
      margin-top: 4px;
    }

    /* Timer Dial */
    .timer-box {
      text-align: right;
    }
    .timer-sec {
      font-size: 38px;
      font-weight: 800;
      color: #34d399;
      line-height: 1;
    }
    .timer-sec.warning { color: #fbbf24; }
    .timer-sec.critical {
      color: #f87171;
      animation: blink 0.6s infinite alternate;
    }
    @keyframes blink {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0.7; transform: scale(1.08); }
    }
    .timer-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* Bidding Paddle Controls */
    .paddles {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .quick-bids {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .custom-bid-row {
      display: flex;
      gap: 8px;
    }

    /* Table Styles */
    .table-container {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th {
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(35, 62, 49, 0.4);
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr.is-me {
      background: rgba(16, 185, 129, 0.08);
    }

    /* Activity Log */
    .log-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 240px;
      overflow-y: auto;
    }
    .log-item {
      font-size: 13px;
      padding: 8px 12px;
      background: var(--surface);
      border-radius: var(--radius-sm);
      border: 1px solid rgba(35, 62, 49, 0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Quick Test Demo Banner */
    .demo-banner {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(16, 185, 129, 0.1));
      border: 1px dashed rgba(245, 158, 11, 0.4);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* Squad Card in Final Screen */
    .squad-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .squad-roster {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .squad-player-pill {
      font-size: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 999px;
      color: #fff;
    }

    .badge-bot {
      font-size: 11px;
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid rgba(139, 92, 246, 0.4);
      color: #c4b5fd;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }

    .btn-xs {
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 4px;
    }
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .pause-banner {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      padding: 12px 16px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-weight: 700;
    }
    .host-badge-pill {
      font-size: 11px;
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
    }
    .host-controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="brand">
      <div class="brand-icon">🏏</div>
      <div>Cricket Auction Pro</div>
    </div>
    <div class="nav-actions">
      <div id="status-badge" class="status-badge lobby">
        <span class="status-dot"></span>
        <span id="status-text">Lobby</span>
      </div>
      <button id="sound-toggle" class="sound-btn" data-action="toggle_sound" onclick="toggleSound()">
        <span id="sound-icon">🔊</span> Sound
      </button>
    </div>
  </header>

  <main id="app">
    <div class="card" style="text-align: center; padding: 40px 20px;">
      <h2 style="margin-bottom: 8px;">🏏 Loading Cricket Auction...</h2>
      <p class="text-muted">Connecting to server and preparing player rosters...</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
