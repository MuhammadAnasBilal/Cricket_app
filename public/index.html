<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fantasy Cricket Auction</title>
<style>
:root{--bg:#f4f6f8;--c:#fff;--t:#14181f;--m:#667085;--a:#0a7d4b;--r:#c0392b;--b:#dde1e7}
@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--c:#1a2027;--t:#eef1f5;--m:#9aa4b2;--a:#35c488;--r:#ff7a6b;--b:#2b343e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 system-ui,sans-serif}
#app{max-width:760px;margin:0 auto;padding:14px}h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:0 0 8px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}
.m{color:var(--m);font-size:14px}.big{font-size:30px;font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{width:100%;padding:11px;border-radius:8px;border:1px solid var(--b);background:var(--bg);color:var(--t);font-size:16px;margin:4px 0 10px}
button{padding:11px 14px;border-radius:8px;border:0;background:var(--a);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button.s{background:var(--r)}button.g{background:var(--b);color:var(--t)}button:disabled{opacity:.4}
.tm{font-size:34px;font-weight:700;color:var(--r)}.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--b)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--b);text-align:left}.sc{overflow-x:auto}
</style></head><body><div id="app"><p class="m">Loading…</p></div><script src="app.js"></script></body></html>
